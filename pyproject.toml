[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fabrizon"
version = "0.1.0"
description = "Translate Fabric mods for Horizon (Minecraft: Java Edition in Rust). Unofficial."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "melthedev" }]

[project.urls]
Funding = "https://ko-fi.com/melthedev"

[project.scripts]
fabrizon = "fabrizon.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
